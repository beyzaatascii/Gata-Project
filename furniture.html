<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobilyalar | GATA DESIGN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" sizes="48x48">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="piece-gallery.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="navbar-container"></div>

  <div class="wrapper">
    <div class="grid-container" id="furniture-list"></div>
  </div>

  <div id="footer-container"></div>

<!-- Mobilya verileri -->
<script src="furniture.js?v=1"></script>

<!-- Listeyi bas -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Hem window.* hem "çıplak" global isme karşı dayanıklı
  const data =
    (typeof furnitureProducts !== 'undefined') ? furnitureProducts :
    (typeof window !== 'undefined' ? window.furnitureProducts : undefined);

  if (!data || !Array.isArray(data)) {
    const msg = 'furnitureProducts yüklenmedi. js/furniture.js yolu veya dosya içeriğini kontrol et.';
    console.error(msg);
    document.body.insertAdjacentHTML('beforeend', `<pre style="color:crimson">${msg}</pre>`);
    return;
  }

  const container = document.getElementById('furniture-list');
  container.innerHTML = '';
  data.forEach(p => {
    const card = document.createElement('a');
    card.className = 'grid-item';
    card.href = `product.html?cat=furniture&name=${p.id}`;
    card.innerHTML = `
      <img loading="lazy" src="images/pieces/furniture/${p.id}/${p.cover}" alt="${p.title}">
      <p>${p.title}</p>
    `;
    container.appendChild(card);
  });
});
</script>

<script src="include.js"></script>


</body>
</html>
