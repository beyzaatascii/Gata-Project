<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Proje Detay | GATA DESIGN</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="proje_detay.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet" />
</head>

<body>
    <div id="navbar-container"></div>
    <div class="container">
        <div class="slider">
            <div class="slider-track" id="sliderTrack"></div> <button class="prev" id="prevBtn"></button> <button
                class="next" id="nextBtn"></button>
        </div>
        <div class="project-meta">
            <h2 id="projectTitle"></h2>
            <p id="projectYear"></p>
        </div> <button id="infoBtn" onclick="toggleInfo()">Detay</button>
    </div> <!-- 🔥 LIGHTBOX -->
    <div id="lightbox" class="lightbox"> <span class="close-btn" id="closeLightbox">&times;</span> <button
            class="prev-lightbox" id="prevLightbox">‹</button> <img id="lightboxImg" src="" alt="Fullscreen Görsel" />
        <button class="next-lightbox" id="nextLightbox">›</button>
    </div>
    <div id="infoModal" class="info-modal">
        <div class="info-content"> <span class="close-btn" onclick="toggleInfo()">&times;</span>
            <div class="info-item"><strong>Konum:</strong> <span id="location"></span></div>
            <div class="info-item"><strong>Kategori:</strong> <span id="category"></span></div>
            <div class="info-item"><strong>Tasarımcı:</strong> <span id="designer"></span></div>
            <div class="info-item"><strong>Durum:</strong> <span id="status"></span></div>
        </div>
    </div>
    <div id="footer-container"></div>
    <script src="include.js"></script>
    <script src="project.js"></script>
    <script src="proje_detay.js"></script>
</body>

</html>
