<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proje Detay | GATA DESIGN</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="proje_detay.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet" />

    <style>
        .slider {
            position: relative;
            overflow: hidden;
            max-width: 1200px;
            margin: 2rem auto;
            border-radius: 16px;
        }

        .slider-track {
            display: flex;
            transition: transform 0.5s ease;
        }

        .slide {
            min-width: 70%;
            margin-right: 10px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .slide img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            display: block;
        }

        .slider button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
        }

        .prev {
            left: 15px;
        }

        .next {
            right: 15px;
        }

        /* 🔥 LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 99999;
            flex-direction: column;
        }

        .lightbox.show {
            display: flex;
        }

        .lightbox img {
            width: 100vw;
            /* ekran genişliğini tamamen kapla */
            height: 100vh;
            /* ekran yüksekliğini tamamen kapla */
            object-fit: contain;
            /* kırpılma olmasın, orantıyı koru */
            border-radius: 0;
            /* köşeler düz */
        }


        .lightbox .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            z-index: 100000;
        }

        .lightbox button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 50%;
            z-index: 100000;
        }

        .lightbox .prev-lightbox {
            left: 20px;
        }

        .lightbox .next-lightbox {
            right: 20px;
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="slider">
            <div class="slider-track" id="sliderTrack"></div>
            <button class="prev" id="prevBtn">‹</button>
            <button class="next" id="nextBtn">›</button>
        </div>

        <div class="project-meta">
            <h2 id="projectTitle"></h2>
            <p id="projectYear"></p>
        </div>

        <button id="infoBtn" onclick="toggleInfo()">Detay</button>
    </div>

    <!-- 🔥 LIGHTBOX -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn" id="closeLightbox">&times;</span>
        <button class="prev-lightbox" id="prevLightbox">‹</button>
        <img id="lightboxImg" src="" alt="Fullscreen Görsel" />
        <button class="next-lightbox" id="nextLightbox">›</button>
    </div>

    <div id="infoModal" class="info-modal">
        <div class="info-content">
            <span class="close-btn" onclick="toggleInfo()">&times;</span>
            <div class="info-item"><strong>Konum:</strong> <span id="location"></span></div>
            <div class="info-item"><strong>Kategori:</strong> <span id="category"></span></div>
            <div class="info-item"><strong>Tasarımcı:</strong> <span id="designer"></span></div>
            <div class="info-item"><strong>Durum:</strong> <span id="status"></span></div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="include.js"></script>
    <script src="project.js"></script>
    <script src="proje_detay.js"></script>
</body>

</html>
