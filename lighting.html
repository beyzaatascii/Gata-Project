<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aydınlatmalar | GATA DESIGN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" sizes="48x48">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="piece-gallery.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="navbar-container"></div>

  <div class="wrapper">
    <div class="grid-container" id="lighting-list"></div>
  </div>

  <div id="footer-container"></div>

  <!-- Aydınlatma verileri -->
  <script src="js/lighting.js"></script>

  <!-- Listeleme -->
  <script>
    const container = document.getElementById("lighting-list");
    lightingProducts.forEach(p => {
      const card = document.createElement("a");
      card.classList.add("grid-item");
      card.href = `product.html?cat=lighting&name=${p.id}`;
      card.innerHTML = `
        <img src="images/pieces/lighting/${p.id}/${p.cover}" alt="${p.title}">
        <p>${p.title}</p>
      `;
      container.appendChild(card);
    });
  </script>

  <script src="include.js"></script>
</body>
</html>
