<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeler | GATA DESIGN</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="project.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="favicon.png" sizes="48x48" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet" />
</head>

<body>
  <!-- LOGO + MENU -->
  <div id="navbar-container"></div>

  <!-- Proje Galerisi -->
  <div class="project-gallery" id="projectGallery">
    <!-- JS ile projeler buraya yüklenecek -->
  </div>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="include.js"></script>
  <script src="project.js"></script>

 <script>
  // Projeleri yükle
  const container = document.getElementById("projectGallery");

  projects.forEach((project) => {
    const div = document.createElement("div");
    div.className = "project-item";

    const imgPath = `images/projects/${project.folder}/${project.cover}`;

    div.innerHTML = `
      <a href="proje_detay.html?slug=${project.folder}" onclick="return handleImageClick(event, '${imgPath}')">
        <img src="${imgPath}" alt="${project.title}" />
        <p>${project.title}</p>
      </a>
    `;

    container.appendChild(div);
  });
</script>


</body>

</html>
